<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>__NOME__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Verttano v6: rosto holográfico em malha triangulada branca sobre cabeça cinza (modelo de referência). */
:root{--bg:#000;--f:#eaf3ff;--f2:#a9b7c9;--f3:#5d6878;--linha:#242b36;--azul:#4aa8ff;
  --sans:'Rajdhani','Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--f);font-family:var(--sans);font-size:18px;height:100dvh;
  display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:8px;
  padding:env(safe-area-inset-top,0) max(12px,env(safe-area-inset-right,0)) env(safe-area-inset-bottom,0) max(12px,env(safe-area-inset-left,0))}
button,select,input{font:inherit;color:inherit}
.bt{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;background:transparent;border:1px solid var(--f3);color:var(--f);padding:8px 11px;min-height:36px;cursor:pointer;border-radius:0}
.bt:hover{background:#ffffff1c}
.bt:focus-visible,input:focus-visible,select:focus-visible,#face:focus-visible,.ico:focus-visible{outline:2px solid var(--f);outline-offset:2px}
.bt[aria-pressed=true]{background:var(--f);color:#000}
select.bt{background:#000;appearance:none}
.palco{position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse 85% 75% at 50% 46%,#6b6b6f 0%,#59595d 52%,#38383b 100%)}
#face{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.palco::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px)}
.ico{position:absolute;top:max(10px,env(safe-area-inset-top,0));right:0;z-index:2;width:42px;height:42px;display:grid;place-items:center;background:transparent;border:0;color:var(--f2);cursor:pointer}
.ico:hover{color:var(--f)}
.ico svg{width:22px;height:22px;fill:currentColor}
.estado{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:500 10px var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--f2);pointer-events:none;z-index:1}
.estado i{display:block;font-style:normal;letter-spacing:.08em;color:var(--f3);margin-top:3px;text-transform:none;font-size:11px}
#parar{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:2}
.dito{margin:0 auto;max-width:640px;max-height:4.2em;overflow-y:auto;text-align:center;font-weight:500;font-size:20px;line-height:1.3;padding-inline:6px}
#conf{display:grid;gap:8px;max-width:640px;margin:6px auto 0;width:100%}
#conf:empty{display:none}
.conf{border:1px solid var(--f);background:#000;padding:10px 12px;display:grid;gap:8px;font-size:18px;line-height:1.3}
.conf .bs{display:flex;gap:8px;flex-wrap:wrap}
.conf .sim{background:var(--f);color:#000}
.entrada{display:flex;gap:8px;padding-bottom:10px;max-width:720px;width:100%;margin:0 auto}
.entrada input{flex:1;min-width:0;font:500 18px var(--sans);background:#ffffff0d;border:1px solid var(--linha);padding:11px 14px;color:var(--f);border-radius:0}
.entrada .mic,.entrada .env{width:48px;flex:0 0 48px;padding:0;display:grid;place-items:center}
.entrada svg{width:20px;height:20px;fill:currentColor}
.entrada .mic[aria-pressed=true]{background:var(--f);color:#000}
.entrada .env{background:var(--f);color:#000;border-color:var(--f)}
#ov{position:fixed;inset:0;z-index:20;background:#000000f4;display:flex;flex-direction:column;gap:8px;
  padding:max(12px,env(safe-area-inset-top,0)) max(12px,env(safe-area-inset-right,0)) max(12px,env(safe-area-inset-bottom,0)) max(12px,env(safe-area-inset-left,0))}
#ov .abas{display:flex;gap:6px}#ov .abas .bt{flex:1;padding-inline:4px;letter-spacing:.08em}#ov .abas .fechar{flex:0 0 auto;padding-inline:12px}
.col{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--linha);padding:10px;display:flex;flex-direction:column;gap:10px}
.b{border:1px solid var(--linha);padding:8px 11px;font-size:17px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.b .q{display:block;font:500 9px var(--mono);letter-spacing:.2em;color:var(--f2);margin-bottom:3px}
.b.me{border-color:var(--f3);margin-left:22px}
.e{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;border-left:2px solid var(--f3);padding-left:8px;font-size:15px}
.e time{font:400 10px var(--mono);color:var(--f3);padding-top:3px}
.e small{display:block;font:400 10px var(--mono);color:var(--f3);overflow-wrap:anywhere}
.e.f{border-color:var(--f)}.e.r{border-color:var(--f2)}.e.x{border-left-style:dashed;border-color:var(--f)}
#pc h3{font:500 10px var(--mono);letter-spacing:.18em;color:var(--f2);margin:16px 0 6px}
#pc .it{border-top:1px solid var(--linha);padding:8px 0;font-size:16px}
#pc a{color:var(--f)}#pc small{display:block;color:var(--f3);font:400 10px var(--mono)}
.aj{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.aj label{font:400 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--f2);display:flex;flex-direction:column;gap:6px}
.aj .info{font:400 11px var(--mono);color:var(--f3);overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>

<section class="palco" aria-label="Verttano">
  <canvas id="face" tabindex="0" role="button" aria-label="Rosto do Verttano. Toque para falar."></canvas>
  <button class="ico" id="reg" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  <button class="bt" id="parar" hidden title="Parar tudo agora">Parar</button>
  <div class="estado"><span id="st">aguardando</span><i id="sub">toque no rosto para falar</i></div>
</section>

<div>
  <p class="dito" id="dito" aria-live="polite">Olá. Eu sou o Verttano. Toque no meu rosto e fale, ou escreva abaixo.</p>
  <div id="conf"></div>
</div>

<form class="entrada" id="f">
  <button type="button" class="bt mic" id="mic" aria-pressed="false" aria-label="Falar com o Verttano"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12z"/></svg></button>
  <input id="t" placeholder="Escreva ao __NOME__…" autocomplete="off" maxlength="4000" enterkeyhint="send" aria-label="Mensagem">
  <button class="bt env" id="env" hidden aria-label="Enviar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5v-6.2l9-2.3-9-2.3V3.5L22 12z"/></svg></button>
</form>

<div id="ov" hidden>
  <div class="abas">
    <button class="bt" id="ta1" aria-pressed="true">Conversa</button>
    <button class="bt" id="ta2" aria-pressed="false">Atividade</button>
    <button class="bt" id="ta3" aria-pressed="false">Painel</button>
    <button class="bt" id="ta4" aria-pressed="false">Ajustes</button>
    <button class="bt fechar" id="fo" aria-label="Fechar">✕</button>
  </div>
  <div class="col" id="v1"><div id="chat" style="display:flex;flex-direction:column;gap:10px"></div></div>
  <div class="col" id="v2" hidden><div id="ev" style="display:flex;flex-direction:column;gap:10px"></div></div>
  <div class="col" id="v3" hidden><div id="pc"></div></div>
  <div class="col" id="v4" hidden>
    <div class="aj">
      <button class="bt" id="mudo" aria-pressed="false" title="Silenciar a voz das respostas">Mudo</button>
      <button class="bt" id="trocarvoz" type="button" title="Escolher outra voz em português">Trocar voz</button>
      <small id="vozAtual" style="opacity:.7"></small>
      <label>Modo<select class="bt" id="modo" autocomplete="off"><option>observar</option><option selected>supervisionado</option><option>liberado</option></select></label>
      <label>Qualidade da malha do rosto<select class="bt" id="qual" autocomplete="off"><option value="b">Baixa (mais leve)</option><option value="m" selected>Média</option><option value="a">Alta (mais detalhada)</option></select></label>
      <div class="info" id="info">…</div>
    </div>
  </div>
</div>

<script>
const T="__TOKEN__",$=s=>document.querySelector(s),H={"x-alfred":T,"content-type":"application/json"};
let ignorar=false,ultimo=0,replay=true,ocupado=false,tOcup=0,usando=null,falando=false,gravando=false,transcrevendo=false,mudo=false,palavra="",ciclo=0,fimFala=null,seguro=0;
let emo="neutro",emoAte=0,ativo=performance.now();
const acordar=()=>{ativo=performance.now()};
try{mudo=localStorage.getItem("vt_mudo")==="1"}catch(e){}
const api=(p,b)=>fetch(p,{method:"POST",headers:H,body:JSON.stringify(b||{})}).then(async r=>{if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||r.status)}return r.json()});
const bonito=n=>String(n||"").replace(/^.*:/,"").replace(/_/g," ").toUpperCase();

/* ---------- conversa e atividade ---------- */
function rolar(el){const p=el.parentElement;p.scrollTop=p.scrollHeight}
function bolha(texto,cls){const d=document.createElement("div");d.className="b "+cls;const q=document.createElement("span");q.className="q";q.textContent=cls==="me"?"VOCÊ":"VERTTANO";d.append(q,document.createTextNode(texto));$("#chat").append(d);rolar($("#chat"))}
function ev(cls,titulo,det,t){const d=document.createElement("div");d.className="e "+cls;d.innerHTML="<time></time><div><b></b><small></small></div>";d.querySelector("time").textContent=t||"";d.querySelector("b").textContent=titulo;d.querySelector("small").textContent=det||"";$("#ev").append(d);rolar($("#ev"))}
function confirmar(e){
  const d=document.createElement("div");d.className="conf";d.setAttribute("role","alertdialog");
  const p=document.createElement("div");p.textContent=(e.risco==="R"?"Ação sem volta. ":"")+"Posso fazer isto? "+e.frase;
  const bs=document.createElement("div");bs.className="bs";d.append(p,bs);
  const bt=(rot,dec,cl)=>{const b=document.createElement("button");b.type="button";b.className="bt "+(cl||"");b.textContent=rot;b.onclick=()=>{api("/api/confirmar",{id:e.id,decisao:dec}).catch(()=>{});d.remove()};bs.append(b)};
  bt("Sim","sim","sim");if(e.risco==="A")bt("Sempre para isto","sempre");bt("Não","nao");
  $("#conf").append(d);ev("f","pedi permissão",e.frase,e.t);
}
function tratar(e){
  ultimo=e.n;acordar();
  switch(e.tipo){
    case"usuario":bolha(e.texto,"me");if(!replay){ocupado=true;tOcup=Date.now();usando=null}break;
    case"resposta":bolha(e.texto,"al");if(!replay){ocupado=false;usando=null;if(ignorar)ignorar=false;else mostrar(e.texto)}break;
    case"ferramenta":ev("f","▸ "+e.nome,JSON.stringify(e.args),e.t);if(!replay)usando=e.nome;break;
    case"resultado":ev(e.ok?"r":"x",(e.ok?"ok ":"falhou ")+e.nome,e.resumo,e.t);break;
    case"confirmar":if(!replay)confirmar(e);break;
    case"uso":ev("","uso",`${e.entrada} entrada · ${e.saida} saída · US$ ${e.usd}`,e.t);break;
    case"aviso":bolha("Aviso: "+e.texto,"al");break;
    case"automacao":ev("f","automação "+e.nome,"rodando ("+e.origem+")",e.t);break;
    case"automacao_fim":ev(e.ok?"r":"x","automação "+e.nome+(e.ok?" concluída":" falhou"),e.resumo,e.t);break;
    case"rotina":ev("f","rotina "+e.nome,"rodando sozinha (só leitura)",e.t);break;
    case"parado":ev("x","parado por você","",e.t);ocupado=false;usando=null;ignorar=false;break;
    case"erro":bolha("Erro: "+e.texto,"al");ocupado=false;break;
  }
  atualizar();
}
function conectar(){
  replay=true;const es=new EventSource(`/api/eventos?t=${T}&desde=${ultimo}`);
  es.onopen=()=>{replay=true;setTimeout(()=>{replay=false},1200)};
  es.onmessage=m=>tratar(JSON.parse(m.data));
  es.onerror=()=>{es.close();setTimeout(conectar,1500)};
}

/* ---------- emoção do texto ---------- */
function emocao(f){
  const s=f.toLowerCase().trim();
  if(/haha|kkk|rsrs|😂|engraçad/.test(s))return"riso";
  if(/desculp|lament|infelizmente|não consegui|não foi possível|falhou|sinto muito|\berro\b/.test(s))return"triste";
  if(/cuidado|atenção|importante|perigo|aviso|nunca|risco|alerta|sem volta/.test(s))return"serio";
  if(/uau|incrível|nossa|caramba|surpre|\bwow\b/.test(s))return"surpreso";
  if(/compreendo|entendo|imagino como|estou aqui|calma|sinto que/.test(s))return"empatico";
  if(/garanto|deixa comigo|pode confiar|sem problemas|com certeza/.test(s))return"confiante";
  if(/será que|duvid|talvez|não tenho certeza|hmm|depende/.test(s))return"cetico";
  if(/ótim|perfeito|prazer|parabéns|feliz|sucesso|bom dia|boa tarde|boa noite|\boi\b/.test(s)||/(^|[^\p{L}])olá(?![\p{L}])/u.test(s))return"feliz";
  if(/\?\s*$/.test(s))return"curioso";
  if(/!|claro|pronto|feito/.test(s))return"feliz";
  return"neutro";
}
function visema(p){
  const t=p.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const V={a:{o:.9,w:1.05},e:{o:.55,w:1.2},i:{o:.3,w:1.3},o:{o:.7,w:.7},u:{o:.45,w:.6}};
  const vs=[...t].filter(c=>V[c]);
  if(!vs.length)return{o:.05,w:1};
  return V[vs[Math.floor(vs.length/2)]];
}

/* ---------- voz: falar as respostas ---------- */
/* Voz estilo mordomo: grave, calma e pausada. Dá para trocar a voz em Ajustes > "Trocar voz". */
const TOM_VOZ=0.7,RITMO_VOZ=0.93,MASC=/daniel|felipe|ricardo|antonio|antônio|luciano|male|masculin/i;
function vozesPT(){const v=window.speechSynthesis?speechSynthesis.getVoices():[];const br=v.filter(x=>/^pt[-_]BR/i.test(x.lang)),pt=v.filter(x=>/^pt/i.test(x.lang)&&!/^pt[-_]BR/i.test(x.lang));return br.concat(pt)}
function vozPT(){
  const l=vozesPT();if(!l.length)return undefined;
  let salva="";try{salva=localStorage.getItem("vt_voz")||""}catch(e){}
  return l.find(x=>x.name===salva)||l.find(x=>MASC.test(x.name))||l[0];
}
function trocarVoz(){
  const l=vozesPT();if(!l.length){$("#dito").textContent="Este aparelho não informou vozes em português.";return}
  const atual=vozPT(),prox=l[(l.indexOf(atual)+1)%l.length];
  try{localStorage.setItem("vt_voz",prox.name)}catch(e){}
  $("#vozAtual").textContent=prox.name;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("Às suas ordens. Esta é a minha voz.");u.lang="pt-BR";u.voice=prox;u.pitch=TOM_VOZ;u.rate=RITMO_VOZ;speechSynthesis.speak(u)}catch(e){}
}
function pararFala(){clearInterval(ciclo);try{speechSynthesis.cancel()}catch(e){}if(fimFala)fimFala()}
function mostrar(texto){
  $("#dito").textContent=texto;$("#dito").scrollTop=0;pararFala();
  const ps=texto.split(/\s+/).filter(Boolean),limpar=w=>w.replace(/[^\p{L}\p{N}-]/gu,"").toUpperCase();
  const offs=[...texto.matchAll(/\S+/g)].map(m=>m.index);
  const sents=[...texto.matchAll(/[^.!?\n]+[.!?]*/g)].map(m=>({ini:m.index,emo:emocao(m[0])}));
  const emoEm=idx=>{let e="neutro";for(const s of sents){if(s.ini<=idx)e=s.emo;else break}emo=e};
  emoEm(0);
  let acabou=false,i=0,recebeu=false,usaTTS=false;
  const fim=()=>{if(acabou)return;acabou=true;clearInterval(ciclo);clearTimeout(seguro);falando=false;palavra="";fimFala=null;emoAte=performance.now()+1800;atualizar()};
  fimFala=fim;falando=true;palavra="";
  const rodar=ms=>{clearInterval(ciclo);ciclo=setInterval(()=>{if(i>=ps.length){if(!usaTTS)fim();return}emoEm(offs[i]||0);palavra=limpar(ps[i++])},ms)};
  if(!mudo&&"speechSynthesis"in window&&!/^Não consegui falar com o cérebro/.test(texto)){
    try{
      const corte=texto.slice(0,600),u=new SpeechSynthesisUtterance(corte);u.lang="pt-BR";u.pitch=TOM_VOZ;u.rate=RITMO_VOZ;const v=vozPT();if(v)u.voice=v;
      u.onboundary=b=>{if(b.name&&b.name!=="word")return;recebeu=true;clearInterval(ciclo);emoEm(b.charIndex);const m=corte.slice(b.charIndex).match(/^\S+/);palavra=limpar(m?m[0]:"")};
      u.onend=fim;u.onerror=()=>{if(recebeu||acabou){fim();return}usaTTS=false;rodar(240)};usaTTS=true;speechSynthesis.speak(u);
      setTimeout(()=>{if(!recebeu&&!acabou)rodar(380)},1500);
    }catch(e){usaTTS=false}
  }
  if(!usaTTS)rodar(240);
  seguro=setTimeout(fim,6000+ps.length*700);atualizar();
}

/* ---------- voz: ouvir pelo microfone ---------- */
let rec,pedacos=[],fluxo,ctxA,analisador,buf=new Uint8Array(256);
async function microfone(){
  acordar();
  if(gravando){rec.stop();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){bolha("Este navegador não liberou o microfone nesta página.","al");return}
  pararFala();
  try{
    fluxo=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(fluxo);pedacos=[];
    rec.ondataavailable=e=>{if(e.data.size)pedacos.push(e.data)};rec.onstop=enviarAudio;
    try{ctxA=new(window.AudioContext||window.webkitAudioContext)();const s=ctxA.createMediaStreamSource(fluxo);analisador=ctxA.createAnalyser();analisador.fftSize=256;s.connect(analisador)}catch(e){analisador=null}
    rec.start();gravando=true;atualizar();
  }catch(x){bolha("Não consegui abrir o microfone: "+x.message,"al")}
}
async function enviarAudio(){
  gravando=false;fluxo.getTracks().forEach(t=>t.stop());try{ctxA.close()}catch(e){}analisador=null;transcrevendo=true;atualizar();
  const fd=new FormData();fd.append("arquivo",new Blob(pedacos,{type:rec.mimeType||"audio/webm"}),"audio.webm");
  try{
    const r=await fetch("/api/transcrever",{method:"POST",headers:{"x-alfred":T},body:fd}),j=await r.json();
    if(!r.ok)throw new Error(j.detail||r.status);
    transcrevendo=false;
    if(!j.texto){$("#dito").textContent="Não ouvi nada. Toque no rosto e tente de novo.";atualizar();return}
    enviar(j.texto);
  }catch(x){transcrevendo=false;bolha("Voz: "+x.message,"al");atualizar()}
}
function enviar(t){
  t=t.trim();if(!t)return;acordar();ocupado=true;tOcup=Date.now();usando=null;pararFala();atualizar();
  api("/api/mensagem",{texto:t,modo:$("#modo").value}).catch(x=>{ocupado=false;bolha("Não enviei: "+x.message,"al");atualizar()});
}

/* ---------- estado e controles ---------- */
function situacao(){if(gravando)return"ouvindo";if(falando)return"falando";if(transcrevendo)return"transcrevendo";if(ocupado)return usando?"consultando":"pensando";return"aguardando"}
const DICA={ouvindo:"fale agora e toque de novo para enviar",falando:"",transcrevendo:"passando a sua fala para texto",pensando:"um instante",aguardando:"toque no rosto para falar"};
function atualizar(){
  const s=situacao();$("#st").textContent=s;$("#sub").textContent=s==="consultando"?bonito(usando).toLowerCase():DICA[s];
  $("#mic").setAttribute("aria-pressed",gravando);$("#mic").setAttribute("aria-label",gravando?"Parar e enviar":"Falar com o Verttano");
  $("#parar").hidden=!(ocupado||falando||transcrevendo);
}
async function estado(){
  try{const r=await fetch("/api/estado",{headers:H}),s=await r.json();
    $("#info").textContent=(s.cerebro_pronto?`${s.provedor} · ${s.modelo}`:"sem chave do cérebro")+` · gasto US$ ${s.gasto_hoje} / ${s.limite}`;
    if(!window._m){$("#modo").value=s.modo;window._m=1}
    if(ocupado&&!s.ocupado&&!gravando&&!transcrevendo&&Date.now()-tOcup>8000){ocupado=false;usando=null}
    atualizar();
  }catch(e){}
}

    return trp(X,Y,z);
  };

  /* vértices: deformação por expressão, luz e brilho de varredura */
  const lx=-.16+P.yaw*.8,ly=-.5,lz=.85,ll=Math.sqrt(lx*lx+ly*ly+lz*lz);
  const scanY=((ms/(trab?1500:3800))%1)*2.7-1.35;
  let ox=0,oy=.1,oa=0,oph=0;
  if(s==="ouvindo"){oa=ampS*3.5;oph=((ms/650)%1)*1.5}
  else if(s==="falando"){oy=.53;oa=P.open*1.1;oph=((ms/420)%1)*1.2}
  for(let k=0;k<N;k++){
    const x=VX[k],y=VY[k];
    const xx=(x+x*mwk*WW[k])*A,yy=(y-.1*(rl*WBL[k]+rr*WBR[k])+.07*P.ang*WT[k]-.09*(smL*WSL[k]+smR*WSR[k])-.035*P.cheek*WC[k]+.34*P.open*WJ[k])*B,zz=VZ[k]*C;
    const X=xx*cY+zz*sY,Y=yy+zz*P.pitch;
    let sx=cx+X*cT-Y*sT;const sy=cy+X*sT+Y*cT;
    if(glA!==0&&Math.abs(y-glY)<.07)sx+=glA*S;
    SX[k]=sx;SY[k]=sy;
    const d=(NX[k]*lx+NY[k]*ly+NZ[k]*lz)/ll,sc=(y-scanY)/.06;
    let gl=Math.exp(-sc*sc)*(trab?1:.8);
    if(oa>0){const q=Math.hypot((x-ox)*ASP,y-oy)-oph;gl+=oa*Math.exp(-q*q*38)}
    BR[k]=Math.min(1,Math.max(0,.2+.85*Math.max(0,d)))*cl;
    GL[k]=Math.min(1.4,gl)*cl;
  }

  /* linhas de ligação ao fundo (saem do contorno da cabeça até a borda da tela) */
  const nC=CONT.length,pulso=1-.45*sono;
  g.lineWidth=Math.max(.7,S/700);
  TET.forEach((t,i)=>{
    const k=CONT[Math.min(nC-1,Math.floor(t.f*(nC-1)))],px=SX[k],py=SY[k];
    const ang=Math.atan2(py-cy,px-cx)+t.j,dx=Math.cos(ang),dy=Math.sin(ang);
    const tx=dx>0?(w-px)/dx:dx<0?-px/dx:1e9,ty=dy>0?(h-py)/dy:dy<0?-py/dy:1e9,L=Math.min(tx,ty);
    if(L<S*.05)return;
    const a0=t.gap?S*.07:0,x0=px+dx*a0,y0=py+dy*a0,x1=px+dx*L,y1=py+dy*L;
    g.strokeStyle=`rgba(255,255,255,${(.24+.1*Math.sin(ms/1300+i*1.7))*pulso})`;
    g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
    g.fillStyle=`rgba(255,255,255,${.85*pulso})`;
    g.beginPath();g.arc(x0,y0,r0*1.5,0,TAU);g.fill();
    g.beginPath();g.arc(x0+(x1-x0)*t.m,y0+(y1-y0)*t.m,r0*1.2,0,TAU);g.fill();
    if(trab){const u=1-((ms/1100+i*.37)%1);g.beginPath();g.arc(x0+(x1-x0)*u,y0+(y1-y0)*u,r0*1.8,0,TAU);g.fill()}
  });

  if(trab){ /* colchetes de varredura */
    const bw=S*.30,bh=B*1.08,L=S*.05;g.strokeStyle="rgba(255,255,255,.6)";g.lineWidth=1.2;
    for(const sx of[-1,1])for(const sy of[-1,1]){g.beginPath();g.moveTo(cx+sx*bw,cy+sy*bh-sy*L);g.lineTo(cx+sx*bw,cy+sy*bh);g.lineTo(cx+sx*bw-sx*L,cy+sy*bh);g.stroke()}
  }

  /* orelhas: malha triangulada, atrás da cabeça */
  for(const sd of[-1,1]){
    const pe=(p,q)=>{const y=.02+q*.24,ex=.19*Math.pow(Math.max(0,1-q*q),.6);return trp(sd*(wp(y)-.03+p*ex),y,-.05-.05*p)};
    const V=[];for(let a=0;a<=4;a++){V.push([]);for(let i=0;i<=8;i++)V[a].push(pe(a/4,-1+i/4))}
    g.beginPath();for(let i=0;i<=8;i++){const p=V[4][i];i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
    for(let i=8;i>=0;i--)g.lineTo(V[0][i][0],V[0][i][1]);
    g.closePath();g.fillStyle=`rgb(${Math.round(78*cl+14)},${Math.round(79*cl+14)},${Math.round(84*cl+14)})`;g.fill();
    const L=new Path2D(),Nn=new Path2D();
    for(let a=0;a<=4;a++)for(let i=0;i<=8;i++){
      const p=V[a][i];
      if(i<8){L.moveTo(p[0],p[1]);L.lineTo(V[a][i+1][0],V[a][i+1][1])}
      if(a<4){L.moveTo(p[0],p[1]);L.lineTo(V[a+1][i][0],V[a+1][i][1]);if(i<8){L.moveTo(p[0],p[1]);L.lineTo(V[a+1][i+1][0],V[a+1][i+1][1])}}
      Nn.moveTo(p[0]+r0*.9,p[1]);Nn.arc(p[0],p[1],r0*.9,0,TAU);
    }
    g.lineWidth=Math.max(.55,S/620);g.strokeStyle=`rgba(255,255,255,${.5*pulso})`;g.stroke(L);
    g.fillStyle=`rgba(255,255,255,${.8*pulso})`;g.fill(Nn);
  }

  /* cabeça: silhueta e triângulos sombreados em cinza */
  g.beginPath();CONT.forEach((k,n)=>n?g.lineTo(SX[k],SY[k]):g.moveTo(SX[k],SY[k]));g.closePath();
  g.fillStyle="rgb(40,40,44)";g.fill();
  const fills=Array.from({length:FIL},()=>new Path2D());
  for(let t=0;t<TRI.length;t+=3){
    const a=TRI[t],b=TRI[t+1],c=TRI[t+2];
    const v=(BR[a]+BR[b]+BR[c])/3+.1*(GL[a]+GL[b]+GL[c])/3,p=fills[Math.min(FIL-1,Math.floor(Math.min(.999,Math.max(0,v))*FIL))];
    p.moveTo(SX[a],SY[a]);p.lineTo(SX[b],SY[b]);p.lineTo(SX[c],SY[c]);p.closePath();
  }
  g.lineWidth=.7;g.lineJoin="round";
  fills.forEach((p,l)=>{const gv=Math.round(34+150*Math.pow((l+.5)/FIL,.95)),col=`rgb(${gv},${gv},${gv+3})`;g.fillStyle=col;g.strokeStyle=col;g.fill(p);g.stroke(p)});

  /* olhos: globo cinza, íris escura e pálpebras pesadas (a malha passa por cima) */
  for(const sd of[-1,1]){
    const ex=sd*.38,ey=-.12,c=proj(ex,ey,zbase(ex,ey)+.02),ew=S*.058,eh=Math.max(.6,S*.0185*eoEff);
    const up=eh*2.1*(1-.25*Math.max(0,P.gy)),lo=eh*1.4;
    const ix=c[0]+P.gx*ew*.4,iy=c[1]+P.gy*eh*.5;
    const abertura=()=>{g.beginPath();g.moveTo(c[0]-ew,c[1]);g.quadraticCurveTo(c[0],c[1]-up,c[0]+ew,c[1]);g.quadraticCurveTo(c[0],c[1]+lo,c[0]-ew,c[1]);g.closePath()};
    const so=g.createRadialGradient(c[0],c[1],ew*.3,c[0],c[1],ew*1.8);so.addColorStop(0,`rgba(0,0,0,${.34*cl})`);so.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=so;g.fillRect(c[0]-ew*2,c[1]-ew*2,ew*4,ew*4);
    g.save();abertura();
    const gr=g.createRadialGradient(c[0],c[1]-eh*.3,1,c[0],c[1],ew*1.05);gr.addColorStop(0,"#e8e8ec");gr.addColorStop(.7,"#b3b4ba");gr.addColorStop(1,"#6c6d73");
    g.fillStyle=gr;g.fill();g.clip();
    if(eoEff>.25){
      const ir=Math.min(S*.0165,eh*1.1);
      g.fillStyle="rgb(46,48,54)";g.beginPath();g.arc(ix,iy,ir,0,TAU);g.fill();
      g.fillStyle="rgb(12,13,16)";g.beginPath();g.arc(ix,iy,ir*.45,0,TAU);g.fill();
      g.fillStyle="rgba(255,255,255,.88)";g.beginPath();g.arc(ix-ir*.35,iy-ir*.4,Math.max(.8,S*.0028),0,TAU);g.fill();
    }
    const sb=g.createLinearGradient(0,c[1]-up*.5,0,c[1]+eh*.4);sb.addColorStop(0,"rgba(0,0,0,.55)");sb.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=sb;g.fillRect(c[0]-ew,c[1]-up,ew*2,up+eh);
    g.restore();
    g.lineCap="round";
    g.strokeStyle=`rgba(255,255,255,${.4*pulso})`;g.lineWidth=Math.max(.7,S/520); /* dobra da pálpebra */
    g.beginPath();g.moveTo(c[0]-ew*1.05,c[1]-eh*.15);g.quadraticCurveTo(c[0],c[1]-up*1.9-eh,c[0]+ew*1.05,c[1]-eh*.15);g.stroke();
    g.strokeStyle=`rgba(255,255,255,${.6*pulso})`;g.lineWidth=Math.max(.8,S/420);
    g.beginPath();g.moveTo(c[0]-ew,c[1]);g.quadraticCurveTo(c[0],c[1]+lo,c[0]+ew,c[1]);g.stroke();
    g.save();g.shadowColor="rgba(255,255,255,.9)";g.shadowBlur=ampS*30*(1-sono);
    g.strokeStyle=`rgba(255,255,255,${.97*pulso})`;g.lineWidth=Math.max(1.2,S/240);
    g.beginPath();g.moveTo(c[0]-ew,c[1]);g.quadraticCurveTo(c[0],c[1]-up,c[0]+ew,c[1]);g.stroke();g.restore();
  }

  /* arestas da malha em 5 níveis de brilho */
  const linhas=LAL.map(()=>new Path2D());
  for(let e=0;e<ED.length;e+=2){
    const a=ED[e],b=ED[e+1],q=.22+.25*(BR[a]+BR[b])+.275*(GL[a]+GL[b]),p=linhas[Math.min(4,Math.floor(q*5))];
    p.moveTo(SX[a],SY[a]);p.lineTo(SX[b],SY[b]);
  }
  g.lineWidth=Math.max(.6,S/560);g.lineCap="round";
  linhas.forEach((p,l)=>{g.strokeStyle=`rgba(255,255,255,${LAL[l]*pulso})`;g.stroke(p)});

  /* nós da malha */
  const nos=[new Path2D(),new Path2D(),new Path2D()],hubs=new Path2D(),brilho=[];
  for(let k=0;k<N;k++){
    if(GL[k]>.45)brilho.push(k);
    if(HUB[k]){hubs.moveTo(SX[k]+r0*1.9,SY[k]);hubs.arc(SX[k],SY[k],r0*1.9,0,TAU)}
    else{const q=.3+.5*BR[k]+.6*GL[k],p=nos[q>.8?2:q>.55?1:0];p.moveTo(SX[k]+r0,SY[k]);p.arc(SX[k],SY[k],r0,0,TAU)}
  }
  [.55,.8,1].forEach((a,i)=>{g.fillStyle=`rgba(255,255,255,${a*pulso})`;g.fill(nos[i])});
  g.save();g.shadowColor="rgba(255,255,255,.9)";g.shadowBlur=7;g.fillStyle=`rgba(255,255,255,${.95*pulso})`;g.fill(hubs);
  for(const k of brilho){g.beginPath();g.arc(SX[k],SY[k],r0*(1.3+GL[k]),0,TAU);g.fill()}
  g.restore();

  /* nariz: asa e narinas */
  const nzp=(x,y)=>proj(x,y,zbase(x,y)+.015);
  g.lineWidth=Math.max(.9,S/380);g.strokeStyle=`rgba(255,255,255,${.8*pulso})`;
  g.beginPath();
  for(let i=0;i<=16;i++){const th=(i/16*2-1)*Math.PI*.5,p=nzp(.18*Math.sin(th),.2+.135*Math.cos(th));i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
  g.stroke();
  g.strokeStyle=`rgba(255,255,255,${.65*pulso})`;
  for(const sd of[-1,1]){g.beginPath();for(let i=0;i<=14;i++){const th=i/14*TAU,p=nzp(sd*.075+.04*Math.cos(th),.3+.02*Math.sin(th));i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.stroke()}

  /* boca: cavidade, dentes e contorno dos lábios */
  const xm=.3*P.mwid,fo=Math.min(1,P.open*3),top=[],bot=[],upl=[],lol=[];
  for(let i=0;i<=14;i++){const x=-xm+2*xm*i/14;top.push(proj(x,.53,zbase(x,.53)))}
  if(P.open>.05){
    for(let i=0;i<=14;i++){const x=-xm+2*xm*i/14,y=.53+.09*fo*Math.pow(Math.max(0,1-(x/xm)*(x/xm)),.7);bot.push(proj(x,y,zbase(x,.56)))}
    g.beginPath();top.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));for(let i=bot.length-1;i>=0;i--)g.lineTo(bot[i][0],bot[i][1]);g.closePath();
    g.fillStyle="rgba(10,10,12,.97)";g.fill();
    if(P.open>.15){
      g.beginPath();top.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
      for(let i=top.length-1;i>=0;i--){const hb=(bot[i][1]-top[i][1])*.3;g.lineTo(top[i][0],top[i][1]+hb)}
      g.closePath();g.fillStyle="rgba(230,230,236,.55)";g.fill();
    }
  }
  const xl=xm*1.08;
  for(let i=0;i<=16;i++){
    const x=-xl+2*xl*i/16,u=Math.max(0,1-(x/xl)*(x/xl));
    const yu=.53-.05*Math.pow(u,.55)+.012*Math.exp(-(x/.05)*(x/.05)),yl=.53+.09*fo*Math.pow(Math.max(0,1-(x/xm)*(x/xm)),.7)+.06*Math.pow(u,.6);
    upl.push(proj(x,yu,zbase(x,yu)+.012));lol.push(proj(x,yl,zbase(x,yl)+.012));
  }
  const traco=(pp)=>{g.beginPath();pp.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()};
  g.lineWidth=Math.max(.9,S/360);g.strokeStyle=`rgba(255,255,255,${.85*pulso})`;traco(upl);traco(lol);
  g.lineWidth=Math.max(1.1,S/280);g.strokeStyle=`rgba(255,255,255,${.97*pulso})`;traco(top);if(bot.length)traco(bot);

  /* forma de onda da voz */
  const wy=cy+B*1.2,wl=S*.26,amp=s==="falando"?S*.018*(.3+P.open*1.6):s==="ouvindo"?S*(.004+ampS*.12):trab?S*.006:S*.0015;
  g.beginPath();g.lineWidth=1.2;g.strokeStyle=`rgba(255,255,255,${s==="aguardando"?.3:.8})`;
  for(let i=0;i<=80;i++){const u=i/80*2-1,env=Math.pow(1-u*u,1.5),y=wy+Math.sin(i*.9+ms/70)*Math.sin(i*.37-ms/130)*amp*env;i?g.lineTo(cx+u*wl,y):g.moveTo(cx+u*wl,y)}
  g.stroke();
}
tamanho();requestAnimationFrame(quadro);
pintarMudo();conectar();estado();setInterval(estado,5000);atualizar();
</script></body></html>
