<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — {{ nome }}</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: #000; color: #eaf3ff; font-family: system-ui, sans-serif;
    }
    .card {
      width: min(380px, 92vw); border: 1px solid #333; padding: 28px 24px;
      display: grid; gap: 14px;
    }
    h1 { margin: 0 0 4px; font-size: 1.4rem; font-weight: 600; }
    p { margin: 0; color: #8a94a6; font-size: 0.9rem; }
    label { display: grid; gap: 6px; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: #8a94a6; }
    input {
      background: #111; border: 1px solid #333; color: #eaf3ff;
      padding: 12px 14px; font-size: 1rem;
    }
    button {
      background: #eaf3ff; color: #000; border: 0; padding: 12px;
      font-weight: 600; cursor: pointer; margin-top: 6px;
    }
    button:hover { opacity: 0.9; }
    a { color: #4aa8ff; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div>
      <h1>{{ nome }}</h1>
      <p>Entre para continuar</p>
    </div>
    <label>E-mail
      <input type="email" name="email" required placeholder="voce@email.com" autocomplete="email">
    </label>
    <label>Senha
      <input type="password" name="senha" required placeholder="••••••••" autocomplete="current-password">
    </label>
    <button type="submit">Entrar</button>
    <p style="text-align:center"><a href="/">Voltar ao Verttano</a></p>
  </form>
</body>
</html>
