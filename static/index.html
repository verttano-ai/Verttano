<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Verttano</title>
<script>
/* ===== CONFIGURAÇÃO DO VERTTANO — edite só a linha do endpoint ===== */
window.VERTTANO_CONFIG = {
  endpoint: '/api/chat'   /* troque null pelo endereço do seu servidor, entre aspas. Ex.: endpoint: '/api/chat' */
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cy:#00e5ff;
  --cy-soft:#7df4ff;
  --cy-dim:#4aa8ba;
  --ink:#d9fbff;
  --navy-0:#000000;
  --navy-1:#020a18;
  --navy-2:#031a33;
  --navy-3:#06335a;
  --c:14px;
  --font-h:'Orbitron','Segoe UI',system-ui,sans-serif;
  --font-b:'Rajdhani','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--font-b)}
body{position:fixed;inset:0;user-select:none;-webkit-user-select:none}

/* ---------- fundo ---------- */
#bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 70% 55% at 50% 36%, rgba(0,120,190,.42) 0%, rgba(3,40,80,.34) 38%, transparent 72%),
    linear-gradient(180deg,#000 0%,var(--navy-1) 38%,#02142b 62%,#000 100%);
  animation:bgBreath 9s ease-in-out infinite}
@keyframes bgBreath{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
body[data-state="speaking"] #bg{animation-duration:2.6s}
body[data-state="thinking"] #bg{animation-duration:1.8s}

#grid{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.22;
  background-image:
    linear-gradient(rgba(0,229,255,.18) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.18) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 0%,transparent 75%);
  mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 0%,transparent 75%);
  animation:gridDrift 24s linear infinite}
@keyframes gridDrift{to{background-position:56px 56px,56px 56px}}

#stage{position:fixed;inset:0;z-index:2;touch-action:manipulation;cursor:pointer}

#face{position:fixed;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity 1.4s ease;
  filter:drop-shadow(0 0 22px rgba(0,200,255,.35))}

#scan{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,transparent 0,transparent 3px,rgba(0,229,255,.035) 3px,rgba(0,229,255,.035) 4px)}
#scan::after{content:"";position:absolute;left:0;right:0;height:22vh;top:-22vh;
  background:linear-gradient(180deg,transparent,rgba(0,229,255,.07),transparent);
  animation:sweep 7s linear infinite}
@keyframes sweep{to{transform:translateY(130vh)}}
#vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 45%,rgba(0,0,0,.75) 100%)}

/* ---------- cabeçalho ---------- */
.top{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(env(safe-area-inset-top) + 18px) 20px 0;pointer-events:none}
.brand h1{margin:0;font-family:var(--font-h);font-weight:900;font-size:20px;letter-spacing:.42em;
  background:linear-gradient(90deg,#eaffff,var(--cy) 60%,#0aa4d6);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 8px rgba(0,229,255,.55))}
.brand .sub{display:block;margin-top:4px;font-family:var(--font-h);font-size:9px;letter-spacing:.36em;color:var(--cy-dim)}

.chip{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 12px;border:1px solid rgba(0,229,255,.35);
  background:rgba(0,30,55,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:999px;font-family:var(--font-h);font-size:10px;letter-spacing:.22em;color:var(--cy-soft);
  box-shadow:0 0 14px rgba(0,229,255,.18) inset,0 0 16px rgba(0,229,255,.12)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
body[data-state="listening"] .dot{animation-duration:.7s;background:#7dffd9;box-shadow:0 0 12px #7dffd9}
body[data-state="thinking"] .dot{animation-duration:.4s;background:#9fdcff;box-shadow:0 0 12px #9fdcff}
body[data-state="speaking"] .dot{animation-duration:.55s;background:#fff;box-shadow:0 0 14px #bff}

/* ---------- dock inferior ---------- */
.dock{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);
  padding:0 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:12px}

.hint{align-self:center;font-family:var(--font-h);font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--cy-dim);
  text-shadow:0 0 10px rgba(0,229,255,.4);animation:hintBlink 2.4s ease-in-out infinite}
.hint::before,.hint::after{content:"";display:inline-block;width:22px;height:1px;vertical-align:middle;margin:0 10px;
  background:linear-gradient(90deg,transparent,var(--cy-dim))}
.hint::after{transform:scaleX(-1)}
@keyframes hintBlink{0%,100%{opacity:.55}50%{opacity:1}}

.chamfer{clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
.frame{padding:1px;background:linear-gradient(135deg,rgba(0,229,255,.95),rgba(0,229,255,.12) 38%,rgba(0,229,255,.12) 62%,rgba(0,229,255,.7));
  transition:background .3s}
.inner{--c:13px;background:linear-gradient(180deg,rgba(2,30,56,.82),rgba(0,12,28,.9));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

.panel{position:relative;padding:14px 20px 16px;min-height:84px;max-height:30vh;overflow:auto;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.tag{display:flex;align-items:center;gap:8px;font-family:var(--font-h);font-size:9px;letter-spacing:.32em;color:var(--cy)}
.tag i{width:14px;height:2px;background:var(--cy);box-shadow:0 0 8px var(--cy)}
.user{margin:8px 0 0;font-size:15px;letter-spacing:.04em;color:var(--cy-dim);font-style:italic;min-height:0}
.user:empty{display:none}
.caption{margin:8px 0 0;font-size:21px;line-height:1.3;font-weight:500;letter-spacing:.025em;color:var(--ink);
  text-shadow:0 0 12px rgba(0,229,255,.55),0 0 2px rgba(180,255,255,.6)}
.caption.typing::after{content:"▍";margin-left:2px;color:var(--cy);animation:caret .7s steps(2) infinite}
@keyframes caret{50%{opacity:0}}
body[data-state="speaking"] .frame:first-of-type{background:linear-gradient(135deg,#fff,rgba(0,229,255,.5) 40%,rgba(0,229,255,.4) 60%,#fff)}

/* ---------- compositor ---------- */
#composer{display:flex;align-items:center;gap:10px}
.fieldwrap{flex:1;min-width:0;transition:filter .25s}
.fieldwrap:focus-within{filter:drop-shadow(0 0 9px rgba(0,229,255,.55))}
.fieldwrap:focus-within .frame{background:linear-gradient(135deg,#7df4ff,rgba(0,229,255,.55) 40%,rgba(0,229,255,.55) 60%,#7df4ff)}
.field .inner{display:flex;height:50px}
#msg{flex:1;min-width:0;width:100%;height:100%;padding:0 18px;background:transparent;border:0;outline:0;
  font-family:var(--font-b);font-size:18px;font-weight:500;letter-spacing:.05em;color:var(--ink);caret-color:var(--cy);
  user-select:text;-webkit-user-select:text}
#msg::placeholder{color:rgba(125,244,255,.38);letter-spacing:.08em}

.mic,.send{flex:none;width:52px;height:52px;border:0;cursor:pointer;color:var(--cy);display:grid;place-items:center;transition:transform .15s,filter .2s,box-shadow .2s}
.mic{position:relative;border-radius:50%;background:radial-gradient(circle at 50% 35%,rgba(0,90,140,.55),rgba(0,18,40,.85));
  border:1px solid rgba(0,229,255,.6);box-shadow:0 0 14px rgba(0,229,255,.3),inset 0 0 12px rgba(0,229,255,.15)}
.mic:hover{box-shadow:0 0 22px rgba(0,229,255,.6),inset 0 0 14px rgba(0,229,255,.3)}
.mic:active,.send:active{transform:scale(.92)}
.mic::before,.mic::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--cy);opacity:0;pointer-events:none}
body[data-state="listening"] .mic{color:#052;background:radial-gradient(circle at 50% 35%,#7dffe9,#00cfe8);box-shadow:0 0 26px rgba(0,255,230,.7)}
body[data-state="listening"] .mic::before{animation:ring 1.4s ease-out infinite}
body[data-state="listening"] .mic::after{animation:ring 1.4s ease-out .7s infinite}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}

.send{--c:12px;background:linear-gradient(135deg,#00e5ff,#0a8fd8);color:#001628;box-shadow:0 0 18px rgba(0,229,255,.5)}
.send:hover{filter:brightness(1.2) drop-shadow(0 0 10px rgba(0,229,255,.8))}
.send svg{transition:transform .2s}
.send:hover svg{transform:translateX(3px)}

@media (max-width:520px){
  .brand h1{font-size:16px}
  .caption{font-size:19px}
  .mic,.send{width:48px;height:48px}
  .field .inner{height:48px}
}
@media (prefers-reduced-motion:reduce){
  #grid,#scan::after,#bg{animation:none}
}

/* ---------- interface limpa: legenda discreta, sem painel ---------- */
.subtitle{align-self:center;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;
  text-align:center;transition:opacity .8s ease;pointer-events:none}
.subtitle:not(:has(p:not(:empty))){display:none}
.subtitle.out{opacity:0}
.subtitle p{margin:0;max-width:34em;animation:rise .5s ease both}
.subtitle .user{font-size:15px;color:var(--cy-dim);text-shadow:0 2px 10px #000}
.subtitle .caption{font-size:20px;line-height:1.3;
  text-shadow:0 0 12px rgba(0,229,255,.55),0 2px 12px #000,0 0 2px rgba(180,255,255,.6)}
.subtitle .caption:empty{display:none}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dock{gap:14px}

</style>
</head>
<body data-state="idle">

<div id="bg"></div>
<div id="grid"></div>
<canvas id="stage"></canvas>
<canvas id="face"></canvas>
<div id="scan"></div>
<div id="vignette"></div>

<header class="top">
  <div class="brand"><h1>VERTTANO</h1></div>
</header>

<main class="dock">
  <div id="subtitle" class="subtitle" aria-live="polite">
    <p id="userLine" class="user"></p>
    <p id="captionText" class="caption"></p>
  </div>

  <form id="composer" autocomplete="off">
    <button type="button" id="mic" class="mic" aria-label="Falar com o Verttano">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>

    <div class="fieldwrap">
      <div class="chamfer frame field">
        <div class="chamfer inner">
          <input id="msg" type="text" placeholder="Mensagem" aria-label="Mensagem" enterkeyhint="send">
        </div>
      </div>
    </div>

    <button type="submit" id="send" class="chamfer send" aria-label="Enviar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</main>

'use strict';

/* =====================================================================

             reply / response / text / message / answer (ou texto puro).

const CONFIG = Object.assign({
  endpoint: null,               // (o endereço agora fica no topo do index.html)
  lang: 'pt-BR',
  greeting: 'Olá. Eu sou o Verttano. Toque no meu rosto e fale, ou escreva abaixo.',

const $ = s => document.querySelector(s);
const canvas = $('#stage'), ctx = canvas.getContext('2d');
const el = {
  sub: $('#subtitle'), caption: $('#captionText'), user: $('#userLine'),
  form: $('#composer'), input: $('#msg'), mic: $('#mic'),

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => 1 - Math.pow(1 - t, 3);
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20261111);

/* =====================================================================
   GEOMETRIA DO ROSTO (nuvem de pontos + malha wireframe)
   ===================================================================== */
const P = [];            // pontos
const E = [];            // arestas [a, b, peso]
const edgeSet = new Set();

function add(x, y, z, tag, o) {
  const p = Object.assign({
    x, y, z, ox: x, oy: y, oz: z, tag, jw: 0, mx: 0, f: 0, cy: 0,
    sx: (rnd() - .5) * 7, sy: (rnd() - .5) * 7, sz: (rnd() - .5) * 7,
    d: rnd(), glow: false, b: 0, e: 0, px: 0, py: 0, k: 1,
  }, o || {});
  P.push(p);
  return P.length - 1;
}
function edge(a, b, w) {
  if (a === b) return;
  const k = a < b ? a * 10000 + b : b * 10000 + a;
  if (edgeSet.has(k)) return;
  edgeSet.add(k);
  E.push([a, b, w || 1]);
}
function chain(ids, closed) {
  for (let i = 0; i < ids.length - 1; i++) edge(ids[i], ids[i + 1]);
  if (closed) edge(ids[ids.length - 1], ids[0]);
}
function frontZ(x, y) {
  const jaw = smooth(-0.1, -0.85, y);
  const rx = 0.78 * (1 - 0.32 * jaw), rz = 0.86 * (1 - 0.1 * jaw);
  const s = Math.sqrt(Math.max(0.0004, 1 - (x / rx) ** 2 - y * y));
  return (rz + 0.06 * jaw) * s;
}
const noseBump = (x, y) => 0.11 * Math.exp(-((x / 0.12) ** 2 + ((y + 0.2) / 0.2) ** 2));
const skinZ = (x, y) => frontZ(x, y) + noseBump(x, y);

function build() {
  // crânio / rosto
  const N = 1000, g = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const ny = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - ny * ny), th = i * g;
    const nx = Math.cos(th) * r, nz = Math.sin(th) * r;
    if (ny < -0.84) continue;
    const jaw = smooth(-0.1, -0.85, ny);
    let x = nx * 0.78 * (1 - 0.32 * jaw), y = ny, z = nz * 0.86 * (1 - 0.1 * jaw);
    if (nz > 0) z += 0.06 * jaw * nz;
    if (nz > 0.2) z += noseBump(x, y);
    x += (rnd() - .5) * 0.02; y += (rnd() - .5) * 0.02; z += (rnd() - .5) * 0.02;
    const jw = nz > 0.15 ? smooth(-0.32, -0.85, ny) * smooth(0.15, 0.55, nz) : 0;
    add(x, y, z, 'skin', { jw });
  }

  // pescoço
  let prev = null;
  for (let r = 0; r < 6; r++) {
    const y = -0.84 - r * 0.11, rad = 0.37 + r * 0.025, ring = [];
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      ring.push(add(Math.cos(a) * rad, y, -0.05 + Math.sin(a) * rad * 0.9, 'neck'));
    }
    chain(ring, true);
    if (prev) ring.forEach((id, i) => edge(id, prev[i]));
    prev = ring;
  }

  // orelhas
  for (const s of [-1, 1]) {
    const o = [], n = [];
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2;
      o.push(add(s * (0.79 + 0.07 * Math.abs(Math.sin(a))), 0.02 + 0.2 * Math.cos(a), -0.06 + 0.1 * Math.sin(a), 'ear'));
    }
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * Math.PI * 2;
      n.push(add(s * (0.83 + 0.03 * Math.abs(Math.sin(a))), 0.02 + 0.11 * Math.cos(a), -0.06 + 0.05 * Math.sin(a), 'ear'));
    }
    chain(o, true); chain(n, true);
  }

  // nariz
  const bridge = [];
  for (let i = 0; i < 9; i++) {
    const y = 0.12 - i * 0.05;
    bridge.push(add(0, y, skinZ(0, y) + 0.012, 'nose'));
  }
  chain(bridge);
  const nostril = [];
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2, x = 0.13 * Math.cos(a), y = -0.31 + 0.045 * Math.sin(a);
    nostril.push(add(x, y, skinZ(x, y) + 0.02, 'nose'));
  }
  chain(nostril, true);
  edge(bridge[8], nostril[9]); edge(bridge[8], nostril[3]);

  // olhos + sobrancelhas
  for (const s of [-1, 1]) {
    const cx = s * 0.3, cy = 0.14, lid = [];
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * Math.PI * 2, sy = Math.sin(a);
      const x = cx + 0.135 * Math.cos(a), y = cy + 0.05 * sy * (sy > 0 ? 1 : 0.75);
      lid.push(add(x, y, skinZ(x, y) + 0.015, sy > 0.05 ? 'lidU' : 'lidL', { cy }));
    }
    chain(lid, true);
    const iris = [];
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * Math.PI * 2, x = cx + 0.034 * Math.cos(a), y = cy + 0.034 * Math.sin(a);
      iris.push(add(x, y, skinZ(x, y) + 0.02, 'iris'));
    }
    const pupil = add(cx, cy, skinZ(cx, cy) + 0.022, 'iris', { glow: true });
    chain(iris, true); iris.forEach(id => edge(id, pupil));
    const sock = [];
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2, x = cx + 0.2 * Math.cos(a), y = cy + 0.1 * Math.sin(a);
      sock.push(add(x, y, skinZ(x, y) + 0.008, 'feat'));
    }
    chain(sock, true);
    const brow = [];
    for (let i = 0; i < 9; i++) {
      const t = i / 8, x = cx + (t - 0.5) * 0.36;
      const y = cy + 0.15 + 0.035 * Math.sin(Math.PI * t) - s * (t - 0.5) * 0.05;
      brow.push(add(x, y, skinZ(x, y) + 0.015, 'brow'));
    }
    chain(brow);
  }

  // boca
  const my = -0.52, hw = 0.2, U = [], L = [];
  for (let i = 0; i <= 14; i++) {
    const t = i / 14 * 2 - 1, f = 1 - t * t, x = t * hw, z = skinZ(x, my) + 0.035 + 0.02 * f;
    U.push(add(x, my + 0.035 * f, z, 'lipU', { mx: x, f }));
    L.push(add(x, my - 0.015 * f, z, 'lipL', { mx: x, f }));
  }
  chain(U); chain(L);
  for (let i = 0; i <= 14; i += 2) edge(U[i], L[i]);

  // malha vizinha (k-nearest)
  const idx = [];
  P.forEach((p, i) => { if (p.tag === 'skin' || p.tag === 'neck' || p.tag === 'ear' || p.tag === 'nose') idx.push(i); });
  for (const i of idx) {
    const a = P[i], c = [];
    for (const j of idx) {
      if (j === i) continue;
      const b = P[j], d = (a.x - b.x) ** 2 + (a.y - b.y) ** 2 + (a.z - b.z) ** 2;
      if (d < 0.05) c.push([d, j]);
    }
    c.sort((u, v) => u[0] - v[0]);
    for (let k = 0; k < Math.min(4, c.length); k++) edge(i, c[k][1]);
  }
  // conexões longas (efeito rede neural)
  const skinIdx = idx.filter(i => P[i].tag === 'skin');
  for (let n = 0, tries = 0; n < 130 && tries < 2000; tries++) {
    const a = skinIdx[(rnd() * skinIdx.length) | 0], b = skinIdx[(rnd() * skinIdx.length) | 0];
    const A = P[a], B = P[b], d = Math.hypot(A.x - B.x, A.y - B.y, A.z - B.z);
    if (d > 0.22 && d < 0.5) { edge(a, b, 0.5); n++; }
  }
}
build();

  yaw: 0, pitch: 0, gx: 0, gy: 0, boot: 0, voiceKick: 0, lastIdx: -1 };
const ptr = { x: 0, y: 0, tx: 0, ty: 0 };
const sp = { active: false, text: '', t0: 0, lb: 0, lt: 0, got: false, cps: CONFIG.cps, utter: null, endAt: 0 };
let rec = null, audioUnlocked = false, shownLen = -1;

/* ---------- visemas: letra → [abertura, largura] ---------- */
const VIS = { a: [.95, .12], e: [.62, .26], i: [.36, .36], o: [.72, -.26], u: [.46, -.36] };
function viseme(ch) {
  ch = (ch || ' ').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (!ch) return [.1, 0];
  if (VIS[ch]) return VIS[ch];
  if ('bmp'.includes(ch)) return [0, 0];
  if ('fv'.includes(ch)) return [.12, .05];
  if (ch === ' ') return [.08, 0];
  if (',.;:!?-—…'.includes(ch)) return [0, 0];
  if (/[a-z]/.test(ch)) return [.22, 0];
  return [.1, 0];
}
function charPos(now) {
  if (!sp.active) return 0;
  const p = sp.got ? Math.min(sp.lb + (now - sp.lt) / 1000 * sp.cps, sp.lb + 14)
                   : (now - sp.t0) / 1000 * sp.cps;
  return Math.min(p, sp.text.length);
}

/* =====================================================================
   RENDER
   ===================================================================== */
let W = 0, H = 0, DPR = 1, S = 1, CX = 0, CY = 0;

/* ---------- rosto ultrarrealista em WebGL (malha deformável sobre a imagem) ---------- */
const VERT = `
attribute vec2 aUV;
uniform float uOpen,uWide,uBlink,uBrow,uYaw,uPitch,uBreath;
uniform vec2 uGaze;
varying vec2 vUV;
const float IMG=626.0;
void main(){
  vec2 p=aUV*IMG;
  float mb=exp(-(pow((abs(p.x-312.)-70.)/55.,2.)+pow((p.y-228.)/16.,2.)));
  p.y-=uBrow*9.*mb;
  float me=exp(-(pow((abs(p.x-312.)-67.)/42.,2.)+pow((p.y-270.)/24.,2.)));
  p.y=270.+(p.y-270.)*(1.-0.93*uBlink*me);
  p+=uGaze*me*vec2(5.,3.);
  float mm=exp(-(pow((p.x-316.)/95.,2.)+pow((p.y-411.)/42.,2.)));
  p.x=316.+(p.x-316.)*(1.+uWide*0.16*mm);
  float jaw=smoothstep(410.,432.,p.y)*(1.-smoothstep(510.,580.,p.y));
  float xm=1.-smoothstep(115.,205.,abs(p.x-312.));
  p.y+=uOpen*38.*jaw*xm;
  float dd=exp(-(pow((p.x-312.)/175.,2.)+pow((p.y-300.)/250.,2.)));
  float nz=exp(-(pow((p.x-315.)/48.,2.)+pow((p.y-338.)/62.,2.)));
  float depth=dd+0.55*nz;
  p.x+=uYaw*80.*depth;
  p.y+=uPitch*60.*depth;
  p=(p-vec2(312.,320.))*uBreath+vec2(312.,320.);
  vUV=aUV;
  vec2 q=p/IMG;
  gl_Position=vec4(q.x*2.-1.,1.-q.y*2.,0.,1.);
}`;
const FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uTex;
uniform float uTime,uLevel,uOpen,uBlink,uScan,uBoot,uGlitch,uSpeak,uListen,uThink;
varying vec2 vUV;
const float IMG=626.0;
const float TX=1.0/626.0;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float val(vec2 uv){vec3 c=texture2D(uTex,uv).rgb;return max(c.r,max(c.g,c.b));}
float lv(float v){return clamp((v-0.10)/0.90,0.,1.);}
vec3 pal(float l){
  vec3 c=mix(vec3(0.0,0.03,0.13),vec3(0.0,0.38,0.95),smoothstep(0.0,0.30,l));
  c=mix(c,vec3(0.0,0.88,1.0),smoothstep(0.25,0.65,l));
  c=mix(c,vec3(0.82,1.0,1.0),smoothstep(0.78,1.25,l));
  return c*smoothstep(0.0,0.10,l);
}
void main(){
  vec2 uv=vUV;
  float gl=uGlitch*step(0.78,hash(vec2(floor(uv.y*40.),floor(uTime*30.))));
  uv.x+=gl*0.008;
  vec2 p=uv*IMG;
  float ca=TX*(0.6+1.8*uLevel+5.*uGlitch);
  float l0=lv(val(uv));
  float l1=lv(val(uv+vec2(ca,0.)));
  float l2=lv(val(uv-vec2(ca,0.)));
  float s=val(uv+vec2(TX*1.5,0.))+val(uv-vec2(TX*1.5,0.))+val(uv+vec2(0.,TX*1.5))+val(uv-vec2(0.,TX*1.5));
  float b1=lv(s*0.25);
  float l=max(l0+(l0-b1)*0.5,0.);
  float bl=0.;
  for(int i=0;i<8;i++){float a=float(i)*0.7854;bl+=val(uv+vec2(cos(a),sin(a))*TX*5.5);}
  bl=lv(bl*0.125);

  float h=hash(floor(p/3.));
  float tw=0.5+0.5*sin(uTime*(1.5+3.*h)+h*40.);
  l*=1.+0.55*smoothstep(0.65,1.,l)*tw;

  float sd=(uv.y-uScan)/0.022;
  l*=1.+0.9*exp(-sd*sd);
  l*=0.94+0.06*sin(p.y*2.1-uTime*2.);

  float dm=length(p-vec2(316.,411.))/IMG;
  l*=1.+uSpeak*0.8*max(0.,cos(dm*26.-uTime*9.))*exp(-dm*3.2);
  float dc=length(p-vec2(312.,300.))/IMG;
  l*=1.+uListen*0.6*max(0.,cos(dc*22.+uTime*5.))*exp(-dc*2.2);
  l*=1.+uThink*0.5*max(0.,sin(h*60.+uTime*10.));

  vec2 e=vec2(abs(p.x-312.)-67.,p.y-270.);
  float me=exp(-(pow(e.x/38.,2.)+pow(e.y/17.,2.)));
  l+=me*(0.07+0.2*uLevel+0.04*sin(uTime*2.2))*(1.-uBlink);
  float mm=exp(-(pow((p.x-316.)/70.,2.)+pow((p.y-412.)/(14.+10.*uOpen),2.)));
  l+=mm*(0.03+0.4*uOpen*(0.4+uLevel));
  l+=mm*uOpen*0.18*(0.5+0.5*sin(p.y*1.2-uTime*24.));
  float cav=exp(-pow((p.x-316.)/52.,2.))*exp(-pow((p.y-417.)/6.,2.));
  l*=1.-0.8*uOpen*cav;

  float bt=uBoot*1.25;
  float rev=1.-smoothstep(bt-0.12,bt,uv.y);
  float edge=exp(-pow((uv.y-bt+0.05)/0.015,2.))*step(uBoot,0.995);
  l=l*rev+edge*l0*2.0;

  float kn=max(l-0.8,0.);
  l=min(l,0.8)+kn/(1.+2.5*kn);
  float r1=clamp((l1+0.02)/(l0+0.02),0.5,2.0), r2=clamp((l2+0.02)/(l0+0.02),0.5,2.0);
  vec3 col=vec3(pal(l*r1).r,pal(l).g,pal(l*r2).b);
  col*=1.0+0.15*uLevel;
  col+=pal(bl*1.1)*0.32*rev;
  float fade=smoothstep(0.,0.05,vUV.x)*smoothstep(1.,0.95,vUV.x)*smoothstep(0.,0.04,vUV.y)*smoothstep(1.,0.93,vUV.y);
  col*=fade;
  gl_FragColor=vec4(col,max(col.r,max(col.g,col.b)));
}`;

const FACE = (() => {
  const cv = $('#face');
  const api = { useGL: false, ready: false, layout() {}, draw() {} };
  let gl = null;
  try { gl = cv.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false }); } catch (e) {}
  if (!gl) return api;
  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) { console.warn('WebGL do rosto indisponível:', e); return api; }

  const N = 80, uvs = new Float32Array((N + 1) * (N + 1) * 2), idx = new Uint16Array(N * N * 6);
  for (let j = 0, k = 0; j <= N; j++) for (let i = 0; i <= N; i++) { uvs[k++] = i / N; uvs[k++] = j / N; }
  for (let j = 0, k = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1;
    idx[k++] = a; idx[k++] = b; idx[k++] = c; idx[k++] = b; idx[k++] = d; idx[k++] = c;
  }
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, uvs, gl.STATIC_DRAW);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  gl.useProgram(prog);
  const loc = gl.getAttribLocation(prog, 'aUV');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  ['uOpen', 'uWide', 'uBlink', 'uBrow', 'uYaw', 'uPitch', 'uBreath', 'uGaze', 'uTex', 'uTime', 'uLevel',
   'uScan', 'uBoot', 'uGlitch', 'uSpeak', 'uListen', 'uThink'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
  const tex = gl.createTexture();

  api.useGL = true;               // enquanto a imagem carrega, nada é desenhado (sem piscar o rosto de reserva)
  api.layout = (left, top, size) => {
    cv.style.left = left + 'px'; cv.style.top = top + 'px';
    cv.style.width = size + 'px'; cv.style.height = size + 'px';
    cv.width = cv.height = Math.max(2, Math.min(960, Math.round(size * DPR)));   // limita o custo em celulares
    gl.viewport(0, 0, cv.width, cv.height);
  };
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    api.ready = true; cv.style.opacity = 1;
  };
  img.onerror = () => { api.useGL = false; };   // sem imagem: usa o rosto desenhado por código
  img.src = window.VERTTANO_FACE || 'face.jpg';

  api.draw = (t, scan, glitching) => {
    if (!api.ready) return;
    const m = S_.mode;
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(U.uTex, 0);
    gl.uniform1f(U.uOpen, S_.open); gl.uniform1f(U.uWide, S_.wide);
    gl.uniform1f(U.uBlink, S_.blink); gl.uniform1f(U.uBrow, S_.brow);
    gl.uniform1f(U.uYaw, S_.yaw); gl.uniform1f(U.uPitch, S_.pitch + S_.nod * 0.05);
    gl.uniform1f(U.uBreath, 1 + Math.sin(t * 1.2) * 0.006 + S_.level * 0.01);
    gl.uniform2f(U.uGaze, S_.gx / 0.035, S_.gy / 0.022);
    gl.uniform1f(U.uTime, t); gl.uniform1f(U.uLevel, S_.level);
    gl.uniform1f(U.uScan, (1.25 - scan) / 2.75 * 1.1 - 0.05);
    gl.uniform1f(U.uBoot, S_.boot); gl.uniform1f(U.uGlitch, glitching ? 1 : 0);
    gl.uniform1f(U.uSpeak, m === 'speaking' ? S_.level : 0);
    gl.uniform1f(U.uListen, m === 'listening' ? S_.level : 0);
    gl.uniform1f(U.uThink, m === 'thinking' ? 1 : 0);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
  };
  return api;
})();

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  // Q = lado da imagem do rosto (px). Cabe entre o cabeçalho e a área de digitação.
  const Q = clamp(Math.min((H - 300) / 0.8946, W * 1.2, 780), 240, 780);
  S = Q / 3.07;
  CX = W / 2;
  const headTop = 80 + Math.max(0, (H - 200 - 80) - 0.8946 * Q) / 2;
  const qy = headTop - (33 / 626) * Q + Q / 2;      // centro da imagem
  CY = qy - S * 0.2;
  FACE.layout(CX - Q / 2, qy - Q / 2, Q);
}
window.addEventListener('resize', resize);
resize();

const sprite = document.createElement('canvas');
sprite.width = sprite.height = 32;
(() => {
  const c = sprite.getContext('2d');
  const g = c.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, 'rgba(210,255,255,1)');
  g.addColorStop(.25, 'rgba(0,229,255,.7)');
  g.addColorStop(1, 'rgba(0,229,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, 32, 32);
})();

const dust = Array.from({ length: 70 }, () => ({
  x: rnd(), y: rnd(), v: .004 + rnd() * .012, r: .6 + rnd() * 1.6, p: rnd() * 6.28,
}));

let nextBlink = 1500, blinkStart = -1, nextSacc = 800, sx = 0, sy = 0;
const glitch = { until: 0, y: 0, dx: 0, next: 5000 };
const buckets = Array.from({ length: 8 }, () => []);

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - frame.last) / 1000 || 0.016);
  frame.last = now;
  const t = now / 1000;
  const mode = S_.mode;

  S_.boot = Math.min(1, S_.boot + dt / 2.6);
  ptr.x += (ptr.tx - ptr.x) * Math.min(1, dt * 4);
  ptr.y += (ptr.ty - ptr.y) * Math.min(1, dt * 4);

  /* ---- fala: boca, sobrancelhas, nod, legenda ---- */
  let tOpen = 0, tWide = 0, tBrow = 0, tLevel = 0.06 + 0.03 * Math.sin(t * 1.3);
  const noise = (Math.sin(t * 7.3) + Math.sin(t * 11.1 + 1) + Math.sin(t * 17.7 + 2)) / 6 + .5;
  if (mode === 'speaking') {
    if (sp.endAt && now > sp.endAt) finishSpeaking();
    const pos = charPos(now), idx = Math.floor(pos), ch = sp.text[idx] || ' ';
    const [o, w] = viseme(ch);
    tOpen = o * (0.86 + 0.14 * Math.sin(t * 22));
    tWide = w;
    tBrow = 0.2 + 0.25 * o + (/\?/.test(sp.text.slice(Math.max(0, idx - 18), idx + 6)) ? 0.35 : 0);
    tLevel = 0.3 + 0.6 * o + 0.1 * noise;
    if (idx !== S_.lastIdx) {
      if (idx > 0 && sp.text[idx - 1] === ' ') S_.nod = 1;
      S_.lastIdx = idx;
    }
    if (idx !== shownLen) { shownLen = idx; setCaption(sp.text.slice(0, idx), true); }
  } else if (mode === 'listening') {
    tLevel = 0.22 + 0.3 * noise + S_.voiceKick * 0.4;
    tBrow = 0.15 + S_.voiceKick * 0.2;
  } else if (mode === 'thinking') {
    tLevel = 0.28 + 0.2 * Math.sin(t * 6);
    tBrow = 0.1;
  }
  S_.voiceKick *= Math.pow(0.04, dt);
  S_.nod *= Math.pow(0.02, dt);
  S_.open += (tOpen - S_.open) * Math.min(1, dt * 20);
  S_.wide += (tWide - S_.wide) * Math.min(1, dt * 16);
  S_.brow += (tBrow - S_.brow) * Math.min(1, dt * 8);
  S_.level += (tLevel - S_.level) * Math.min(1, dt * 10);

  /* ---- piscar e olhar ---- */
  if (blinkStart < 0 && now > nextBlink) { blinkStart = now; }
  if (blinkStart >= 0) {
    const k = (now - blinkStart) / 170;
    if (k >= 1) { blinkStart = -1; S_.blink = 0; nextBlink = now + 1800 + rnd() * 3600; }
    else S_.blink = Math.sin(Math.PI * k);
  }
  if (now > nextSacc) { sx = (rnd() - .5) * 0.02; sy = (rnd() - .5) * 0.012; nextSacc = now + 500 + rnd() * 1800; }
  S_.gx += ((ptr.x * 0.035 + sx) - S_.gx) * Math.min(1, dt * 12);
  S_.gy += ((-ptr.y * 0.022 + sy) - S_.gy) * Math.min(1, dt * 12);

  /* ---- cabeça ---- */
  const yawT = ptr.x * 0.34 + Math.sin(t * 0.35) * 0.07 + (mode === 'speaking' ? Math.sin(t * 1.7) * 0.05 : 0)
             + (mode === 'thinking' ? Math.sin(t * 0.9) * 0.1 : 0);
  const pitchT = ptr.y * 0.14 + Math.sin(t * 0.5) * 0.02 + S_.nod * 0.05 + (mode === 'listening' ? -0.04 : 0)
               + (mode === 'thinking' ? -0.05 : 0);
  S_.yaw += (yawT - S_.yaw) * Math.min(1, dt * 5);
  S_.pitch += (pitchT - S_.pitch) * Math.min(1, dt * 6);
  const cY = Math.cos(S_.yaw), sY = Math.sin(S_.yaw), cX = Math.cos(S_.pitch), sX = Math.sin(S_.pitch);
  const breath = 1 + Math.sin(t * 1.2) * 0.008 + S_.level * 0.012;

  /* ---- glitch ocasional ---- */
  if (now > glitch.next) { glitch.until = now + 140; glitch.y = rnd() * 2.2 - 1; glitch.dx = (rnd() < .5 ? -1 : 1) * (0.025 + rnd() * 0.03); glitch.next = now + 5000 + rnd() * 8000; }
  const glitching = now < glitch.until;

  /* ---- scanner ---- */
  const scanSpeed = mode === 'thinking' ? 0.55 : mode === 'speaking' ? 0.22 : 0.12;
  const scanY = lerp(1.25, -1.5, (t * scanSpeed) % 1);

  FACE.draw(t, scanY, glitching);

  /* ---- transformar pontos (rosto de reserva, só sem WebGL) ---- */
  const boot = S_.boot, spk = mode === 'speaking' ? S_.level : 0, lis = mode === 'listening' ? S_.level : 0;
  const D = 3.4;
  for (let i = 0; !FACE.useGL && i < P.length; i++) {
    const p = P[i];
    let x = p.ox, y = p.oy, z = p.oz, boost = 0;
    switch (p.tag) {
      case 'skin': y -= S_.open * 0.09 * p.jw; break;
      case 'lidU': y = p.oy + (p.cy - 0.01 - p.oy) * S_.blink + S_.brow * 0.02; boost = .3; break;
      case 'lidL': boost = .3; break;
      case 'brow': y += S_.brow * 0.05; boost = .3; break;
      case 'iris': x += S_.gx; y += S_.gy; boost = 1; break;
      case 'lipU': x = p.mx * (1 + S_.wide); y = p.oy - S_.open * 0.012 * p.f; boost = .4; break;
      case 'lipL': x = p.mx * (1 + S_.wide); y = p.oy - S_.open * 0.17 * p.f; boost = .4; break;
      case 'nose': boost = .2; break;
      case 'feat': boost = .1; break;
    }
    y += Math.sin(t * 1.2) * 0.006;
    if (glitching && Math.abs(y - glitch.y) < 0.08) x += glitch.dx;

    const e = ease(clamp(boot * 1.7 - p.d * 0.7, 0, 1));
    if (e < 1) { x = lerp(p.sx, x, e); y = lerp(p.sy, y, e); z = lerp(p.sz, z, e); }
    p.e = e;

    const xr = x * cY + z * sY, zr = -x * sY + z * cY;
    const yr = y * cX - zr * sX, z2 = y * sX + zr * cX;
    const k = D / (D - z2 * breath);
    p.px = CX + xr * k * S * breath;
    p.py = CY - yr * k * S * breath;
    p.k = k;

    const depth = clamp((z2 + 1) / 2, 0, 1);
    let b = 0.26 + 0.5 * depth + boost * 0.35;
    const sd = (y - scanY) / 0.07;
    b += 0.9 * Math.exp(-sd * sd);
    if (spk > 0.02) {
      const dx = x, dy = y + 0.52, dz = z - 0.8, d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      b += spk * 0.6 * Math.max(0, Math.cos(d * 8 - t * 9)) * Math.exp(-d * 1.0);
    }
    if (lis > 0.02) b += lis * 0.5 * Math.max(0, Math.cos(Math.hypot(x, y) * 8 + t * 5));
    if (mode === 'thinking') b += 0.22 * Math.max(0, Math.sin(p.d * 60 + t * 12));
    if (p.tag === 'iris') b = (0.9 + 0.2 * S_.level) * (1 - S_.blink * 0.9);
    if (p.tag === 'neck') b *= smooth(-1.55, -0.9, y);
    p.b = clamp(b, 0, 1.4) * e;
  }

  /* ---------------- desenho ---------------- */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  // partículas ambiente
  ctx.fillStyle = 'rgb(90,235,255)';
  for (const d of dust) {
    d.y -= d.v * dt * (1 + S_.level * 2); if (d.y < -0.02) { d.y = 1.02; d.x = rnd(); }
    ctx.globalAlpha = (0.12 + 0.2 * Math.sin(t * 1.3 + d.p) ** 2) * boot;
    ctx.fillRect(d.x * W + Math.sin(t * .4 + d.p) * 14, d.y * H, d.r, d.r);
  }

  // aura
  const AY = CY + S * 0.2;
  const aura = ctx.createRadialGradient(CX, AY, 0, CX, AY, S * 2);
  aura.addColorStop(0, `rgba(0,200,255,${(0.16 + 0.22 * S_.level) * boot})`);
  aura.addColorStop(.5, `rgba(0,110,200,${0.07 * boot})`);
  aura.addColorStop(1, 'rgba(0,60,140,0)');
  ctx.globalAlpha = 1; ctx.fillStyle = aura;
  ctx.fillRect(CX - S * 2, AY - S * 2, S * 4, S * 4);

  hud(t, boot);

  // arestas
  for (const b of buckets) b.length = 0;
  for (let i = 0; !FACE.useGL && i < E.length; i++) {
    const [a, c, w] = E[i], A = P[a], B = P[c];
    const al = (A.b + B.b) * 0.5 * w * 0.62;
    if (al < 0.035) continue;
    buckets[Math.min(7, (al * 8) | 0)].push(A, B);
  }
  ctx.lineWidth = 0.8; ctx.globalAlpha = 1;
  for (let bi = 0; bi < 8; bi++) {
    const arr = buckets[bi]; if (!arr.length) continue;
    ctx.strokeStyle = `rgba(30,225,255,${(bi + 0.6) / 8 * 0.85})`;
    ctx.beginPath();
    for (let i = 0; i < arr.length; i += 2) { ctx.moveTo(arr[i].px, arr[i].py); ctx.lineTo(arr[i + 1].px, arr[i + 1].py); }
    ctx.stroke();
  }

  // vértices
  ctx.fillStyle = 'rgb(150,250,255)';
  for (let i = 0; !FACE.useGL && i < P.length; i++) {
    const p = P[i];
    if (p.b < 0.08) continue;
    if (p.glow || p.b > 0.72) {
      const s = (p.glow ? 24 : 7 + 14 * (p.b - 0.7)) * p.k;
      ctx.globalAlpha = Math.min(1, p.b);
      ctx.drawImage(sprite, p.px - s / 2, p.py - s / 2, s, s);
    } else {
      ctx.globalAlpha = Math.min(1, p.b * 0.9);
      const s = 1.2 * p.k + 0.6; ctx.fillRect(p.px - s / 2, p.py - s / 2, s, s);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
frame.last = 0;

/* ---------- anéis HUD ao redor do rosto ---------- */
function hud(t, boot) {
  const R = S * 1.55, mode = S_.mode;
  const spin = mode === 'thinking' ? 3 : mode === 'speaking' ? 1.4 : 1;
  ctx.save();
  ctx.translate(CX, CY + S * 0.2);
  ctx.globalAlpha = boot;
  ctx.lineCap = 'round';

  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,229,255,.28)';
  ctx.setLineDash([2, 10]);
  ctx.beginPath(); ctx.arc(0, 0, R * 1.14, t * 0.08 * spin, t * 0.08 * spin + Math.PI * 2); ctx.stroke();

  ctx.strokeStyle = 'rgba(0,229,255,.34)';
  ctx.setLineDash([70, 40, 8, 40]);
  ctx.beginPath(); ctx.arc(0, 0, R * 1.07, -t * 0.12 * spin, -t * 0.12 * spin + Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // marcas de régua
  ctx.strokeStyle = 'rgba(0,229,255,.3)';
  ctx.beginPath();
  for (let i = 0; i < 72; i++) {
    const a = i / 72 * Math.PI * 2 + t * 0.03, r1 = R * 1.21, r2 = r1 + (i % 6 === 0 ? 9 : 4);
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
  }
  ctx.stroke();

  // onda radial reativa (voz / microfone)
  const amp = S_.level * S * 0.1;
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = `rgba(80,240,255,${0.35 + S_.level * 0.6})`;
  ctx.shadowColor = 'rgba(0,229,255,.9)'; ctx.shadowBlur = 8 + S_.level * 14;
  ctx.beginPath();
  for (let i = 0; i <= 200; i++) {
    const a = i / 200 * Math.PI * 2;
    const m = Math.sin(a * 7 + t * 6) * Math.sin(a * 3 - t * 4) * 0.5 + Math.sin(a * 13 + t * 9) * 0.25;
    const r = R * 0.98 + amp * (0.2 + Math.abs(m));
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.shadowBlur = 0;

  // arco de processamento / escuta
  if (mode === 'thinking' || mode === 'listening') {
    ctx.lineWidth = 2.4; ctx.strokeStyle = mode === 'thinking' ? 'rgba(190,245,255,.95)' : 'rgba(120,255,225,.9)';
    ctx.shadowColor = 'rgba(0,229,255,1)'; ctx.shadowBlur = 14;
    const a0 = t * (mode === 'thinking' ? 3.2 : 1.6);
    ctx.beginPath(); ctx.arc(0, 0, R * 1.07, a0, a0 + 1.1); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, R * 1.07, a0 + Math.PI, a0 + Math.PI + 0.5); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* =====================================================================
   ÁUDIO / VOZ
   ===================================================================== */
function pickVoice() {
  if (!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices() || [];
  return vs.find(v => v.lang === 'pt-BR') || vs.find(v => (v.lang || '').toLowerCase().startsWith('pt')) || null;
}
function unlockAudio() {
  if (audioUnlocked || !('speechSynthesis' in window)) return;
  audioUnlocked = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
function stopSpeaking() {
  sp.active = false; sp.utter = null; sp.endAt = 0;
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
}
function finishSpeaking() {
  if (!sp.active) return;
  sp.active = false; sp.utter = null; sp.endAt = 0;
  setCaption(sp.text, false);
  setState('idle');
  scheduleFade(6000);
}
function speak(text) {
  stopSpeaking();
  sp.active = true; sp.text = text; sp.t0 = performance.now(); sp.got = false; sp.lb = 0; sp.lt = sp.t0;
  S_.lastIdx = -1; shownLen = -1;
  setState('speaking');
  const total = text.length / CONFIG.cps * 1000;
  if (!('speechSynthesis' in window)) { sp.cps = CONFIG.cps; sp.endAt = sp.t0 + total + 500; return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = CONFIG.lang; u.rate = 1; u.pitch = 0.92;
  const v = pickVoice(); if (v) u.voice = v;
  sp.cps = CONFIG.cps * u.rate;
  u.onboundary = e => {
    if (sp.utter !== u || typeof e.charIndex !== 'number') return;
    sp.got = true; sp.lb = e.charIndex; sp.lt = performance.now();
  };
  u.onend = u.onerror = () => { if (sp.utter === u) finishSpeaking(); };
  sp.utter = u;
  sp.endAt = sp.t0 + total * 2.2 + 4000;   // rede de segurança
  speechSynthesis.speak(u);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function startListening() {
  if (!SR) { setCaption('Voz indisponível neste navegador. Escreva abaixo.'); scheduleFade(5000); return; }
  let finalText = '';
  rec = new SR();
  rec.lang = CONFIG.lang; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    el.user.textContent = '“' + (finalText + interim).trim() + '”';
    S_.voiceKick = 1;
  };
  rec.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed')
      { setCaption('Permita o uso do microfone para falar comigo.'); scheduleFade(5000); }
  };
  rec.onend = () => {
    rec = null;
    if (S_.mode !== 'listening') return;
    const txt = finalText.trim();
    if (txt) handleUserText(txt); else setState('idle');
  };
  try {
    rec.start();
    el.user.textContent = '';
    setState('listening'); setCaption('');
  } catch (e) { rec = null; setState('idle'); }
}
function toggleMic() {
  unlockAudio();
  if (S_.mode === 'speaking') { stopSpeaking(); setCaption(sp.text); setState('idle'); scheduleFade(4000); return; }
  if (S_.mode === 'listening') { try { rec && rec.stop(); } catch (e) {} return; }
  if (S_.mode === 'thinking') return;
  startListening();
}

/* =====================================================================
   CÉREBRO (conexão com o backend)
   ===================================================================== */
async function getReply(text) {
  if (!CONFIG.endpoint) {
    return 'Recebi: ' + text + '. Esta é uma resposta de demonstração: o meu servidor ainda não está conectado.';
  }
  try {
    const r = await fetch(CONFIG.endpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const ct = r.headers.get('content-type') || '';
    const d = ct.includes('json') ? await r.json() : await r.text();
    if (typeof d === 'string') return d;
    return d.reply || d.response || d.text || d.message || d.answer || JSON.stringify(d);
  } catch (e) {
    return 'Perdi a conexão com o meu núcleo. Tente novamente em instantes.';
  }
}
async function handleUserText(text) {
  el.user.textContent = '“' + text + '”';
  setState('thinking'); setCaption('');
  const reply = await getReply(text);
  speak(String(reply));
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
canvas.addEventListener('pointerdown', e => {
  const dx = (e.clientX - CX) / S, dy = (e.clientY - CY) / S;
  if (Math.abs(dx) < 1.1 && dy > -1.25 && dy < 1.7) toggleMic();
});
window.addEventListener('pointermove', e => {
  ptr.tx = clamp((e.clientX / W) * 2 - 1, -1, 1);
  ptr.ty = clamp((e.clientY / H) * 2 - 1, -1, 1);
});
window.addEventListener('pointerleave', () => { ptr.tx = 0; ptr.ty = 0; });
el.mic.addEventListener('click', toggleMic);
el.form.addEventListener('submit', e => {
  e.preventDefault();
  const text = el.input.value.trim();
  if (!text) return;
  unlockAudio();
  el.input.value = '';
  if (rec) { try { rec.abort(); } catch (er) {} rec = null; }
  stopSpeaking();
  handleUserText(text);
});
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

/* ---------- boot ---------- */
setState('idle');
requestAnimationFrame(frame);
})();

</script>
</body>
